name: 🤖 Agent 7 — Relance clients automatique

on:
  schedule:
    - cron: '0 8 * * 5'   # Chaque vendredi à 8h00 UTC (9h Paris)
  workflow_dispatch:

jobs:
  relancer-clients:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier les relances à envoyer
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          TODAY=$(date +%Y-%m-%d)

          # Lire les relances programmées
          if [ ! -f data/relances.json ]; then
            echo "Aucune relance programmée"
            exit 0
          fi

          # Trouver les relances à faire aujourd'hui
          python3 << 'PYEOF'
          import json, os
          from datetime import datetime

          with open('data/relances.json') as f:
              relances = json.load(f)

          aujourd_hui = datetime.now().date()
          a_envoyer = [r for r in relances if not r.get('fait') and datetime.fromisoformat(r['dateRelance']).date() <= aujourd_hui]

          print(f"{len(a_envoyer)} relance(s) à envoyer aujourd'hui")

          for r in a_envoyer:
              print(f"  → {r['client']} ({r['service']}): {r['message']}")

          # Marquer comme fait
          for r in relances:
              if r in a_envoyer:
                  r['fait'] = True

          with open('data/relances.json', 'w') as f:
              json.dump(relances, f, ensure_ascii=False, indent=2)

          # Sauvegarder la liste pour l'email
          with open('/tmp/relances_a_faire.json', 'w') as f:
              json.dump(a_envoyer, f, ensure_ascii=False, indent=2)
          PYEOF

      - name: Envoyer résumé des relances à Yann
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ ! -f /tmp/relances_a_faire.json ]; then exit 0; fi

          NB=$(python3 -c "import json; data=json.load(open('/tmp/relances_a_faire.json')); print(len(data))")
          if [ "$NB" = "0" ]; then echo "Aucune relance cette semaine"; exit 0; fi

          LISTE=$(python3 -c "
          import json
          data = json.load(open('/tmp/relances_a_faire.json'))
          rows = ''
          for r in data:
              rows += f'<tr><td style=\"padding:10px;border-bottom:1px solid #eee\">{r[\"client\"]}</td><td style=\"padding:10px;border-bottom:1px solid #eee\">{r.get(\"telephone\",\"N/A\")}</td><td style=\"padding:10px;border-bottom:1px solid #eee\">{r[\"service\"]}</td><td style=\"padding:10px;border-bottom:1px solid #eee\">{r[\"message\"]}</td></tr>'
          print(rows)
          ")

          HTML="<div style='font-family:Arial;max-width:700px;margin:0 auto'>
          <div style='background:#1a1a2e;padding:24px;border-radius:12px 12px 0 0;text-align:center'>
            <h2 style='color:#e8a800;margin:0'>🤖 Agent Relance — $NB client(s) à recontacter</h2>
            <p style='color:rgba(255,255,255,0.6);margin:8px 0 0'>Semaine du $(date '+%d %B %Y')</p>
          </div>
          <div style='background:#f5f6fa;padding:32px'>
            <p>Bonjour Yann,</p>
            <p>Voici les clients à recontacter cette semaine pour un rappel d'entretien :</p>
            <table style='width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden'>
              <thead style='background:#1a1a2e;color:#fff'>
                <tr>
                  <th style='padding:12px;text-align:left'>Client</th>
                  <th style='padding:12px;text-align:left'>Téléphone</th>
                  <th style='padding:12px;text-align:left'>Service</th>
                  <th style='padding:12px;text-align:left'>Message suggéré</th>
                </tr>
              </thead>
              <tbody>$LISTE</tbody>
            </table>
            <p style='margin-top:24px;color:#888;font-size:13px'>💡 Conseil : un simple SMS suffit pour fidéliser un client !</p>
          </div>
          </div>"

          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"Agent Relance <agents@ouliecalio.resend.app>\",
              \"to\": [\"mecanique017@gmail.com\"],
              \"subject\": \"🤖 $NB client(s) à relancer cette semaine — Mécanique 17\",
              \"html\": $(echo "$HTML" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')
            }" || echo "Email non envoyé (configurer RESEND_API_KEY)"

      - name: Commit des relances mises à jour
        run: |
          git config user.name "Agent Relance - Mécanique 17"
          git config user.email "mecanique017@gmail.com"
          git add data/ 2>/dev/null
          git diff --staged --quiet || git commit -m "🤖 Agent Relance : $(date +%Y-%m-%d)"
          git push 2>/dev/null || true
