name: 🤖 Agent 9 — Dashboard quotidien

on:
  schedule:
    - cron: '0 7 * * 1-6'  # Lun-Sam à 7h00 UTC (8h Paris)
  workflow_dispatch:

jobs:
  envoyer-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Préparer et envoyer le résumé du jour
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          DATE=$(date '+%A %d %B %Y' --locale=fr_FR 2>/dev/null || date '+%A %d %B %Y')
          JOUR=$(date '+%A' | python3 -c "
          import sys
          jours={'Monday':'Lundi','Tuesday':'Mardi','Wednesday':'Mercredi','Thursday':'Jeudi','Friday':'Vendredi','Saturday':'Samedi'}
          print(jours.get(sys.stdin.read().strip(), 'Aujourd\\'hui'))
          ")

          # Compter les articles de blog
          NB_ARTICLES=$(ls blog/article-*.html 2>/dev/null | wc -l || echo "0")

          HTML_BODY="<div style='font-family:Arial,sans-serif;max-width:600px;margin:0 auto'>
          <div style='background:linear-gradient(135deg,#1a1a2e,#16213e);padding:32px;text-align:center;border-radius:12px 12px 0 0'>
            <h1 style='color:#e8a800;margin:0;font-size:24px'>🤖 Dashboard Mécanique 17</h1>
            <p style='color:rgba(255,255,255,0.7);margin:8px 0 0'>$JOUR — Votre résumé du jour</p>
          </div>
          <div style='background:#f5f6fa;padding:32px'>
            <h2 style='color:#1a1a2e;font-size:18px;margin-bottom:20px'>📋 Résumé agents IA</h2>
            <table style='width:100%;border-collapse:collapse'>
              <tr style='background:#fff;border-radius:8px'>
                <td style='padding:14px 16px;border-bottom:1px solid #eee'>🤖 Agent Blog</td>
                <td style='padding:14px 16px;border-bottom:1px solid #eee;color:#2ecc71;font-weight:700'>$NB_ARTICLES articles publiés</td>
              </tr>
              <tr style='background:#fff'>
                <td style='padding:14px 16px;border-bottom:1px solid #eee'>📅 Horaires du jour</td>
                <td style='padding:14px 16px;border-bottom:1px solid #eee;font-weight:700'>9h00 – 19h00</td>
              </tr>
              <tr style='background:#fff'>
                <td style='padding:14px 16px;border-bottom:1px solid #eee'>🌡️ Agent Météo</td>
                <td style='padding:14px 16px;border-bottom:1px solid #eee;color:#2ecc71'>Actif</td>
              </tr>
              <tr style='background:#fff'>
                <td style='padding:14px 16px'>🎯 Agent Promotions</td>
                <td style='padding:14px 16px;color:#2ecc71'>Actif (saisonnier)</td>
              </tr>
            </table>
            <div style='background:#fff;border-radius:8px;padding:20px;margin-top:24px;border-left:4px solid #e8a800'>
              <h3 style='margin:0 0 8px;color:#1a1a2e'>💡 Action du jour</h3>
              <p style='margin:0;color:#555'>Pensez à répondre aux nouvelles demandes de RDV reçues sur <a href='mailto:mecanique017@gmail.com' style='color:#e8a800'>mecanique017@gmail.com</a></p>
            </div>
            <div style='text-align:center;margin-top:32px'>
              <a href='https://mecanique017.github.io/mecanique017/' style='background:#e8a800;color:#1a1a2e;font-weight:700;padding:14px 32px;border-radius:8px;text-decoration:none;display:inline-block'>Voir le site →</a>
            </div>
          </div>
          <div style='background:#1a1a2e;padding:16px;text-align:center;border-radius:0 0 12px 12px'>
            <p style='color:rgba(255,255,255,0.4);margin:0;font-size:12px'>🤖 Envoyé automatiquement par l'Agent Dashboard Mécanique 17</p>
          </div>
          </div>"

          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"Agents Mécanique 17 <agents@ouliecalio.resend.app>\",
              \"to\": [\"mecanique017@gmail.com\"],
              \"subject\": \"🤖 Dashboard Mécanique 17 — $JOUR\",
              \"html\": $(echo "$HTML_BODY" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')
            }" || echo "Email non envoyé (configurer RESEND_API_KEY dans GitHub Secrets)"
