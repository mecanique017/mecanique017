name: KronoFit — base de données toujours active

# Supabase (offre gratuite) met en pause un projet après 7 jours sans activité :
# l'application ne fonctionne plus tant qu'il n'est pas relancé à la main.
# Une petite requête quotidienne suffit à l'éviter. Elle utilise la clé publique de
# l'application (déjà présente dans son code), aucun secret n'est nécessaire.
on:
  schedule:
    - cron: '17 4 * * *' # tous les jours à 4 h 17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: endurance-saas/essai/src/supabase.ts
          sparse-checkout-cone-mode: false

      - name: Requête sur la base KronoFit
        run: |
          FILE=endurance-saas/essai/src/supabase.ts
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" "$FILE" | head -1)
          KEY=$(grep -oE "eyJ[A-Za-z0-9_.-]+" "$FILE" | head -1)
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST "$URL/rest/v1/rpc/kronofit_ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code : $(cat /tmp/r.json)"
          test "$code" = "200"
