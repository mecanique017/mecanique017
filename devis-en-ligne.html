<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votre devis - MECANIQUE 17 | Garage Jarnac-Champagne (17)</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="images/LOGO.jpg">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background: #f5f5f5; }
        .barre { background: #1a1a2e; border-bottom: 2px solid #e8a800; padding: 12px 20px; color: #fff;
                 font-family: 'Montserrat', sans-serif; font-weight: 700; }
        .barre strong { color: #e8a800; }
        .conteneur { max-width: 820px; margin: 0 auto; padding: 24px 16px 60px; }
        .carte { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,.08);
                 font-family: 'Open Sans', sans-serif; color: #222; }
        .carte h1 { font-family: 'Montserrat', sans-serif; font-size: 1.5rem; margin: 0 0 4px; }
        .carte h2 { font-family: 'Montserrat', sans-serif; font-size: 1.05rem; margin: 22px 0 10px;
                    padding-bottom: 6px; border-bottom: 2px solid #e8a800; }
        .meta { color: #555; font-size: .9rem; }
        table { width: 100%; border-collapse: collapse; font-size: .9rem; }
        th { text-align: left; background: #1a1a2e; color: #fff; padding: 8px; font-weight: 600; }
        td { padding: 8px; border-bottom: 1px solid #eee; vertical-align: top; }
        td.n, th.n { text-align: right; white-space: nowrap; }
        .groupe td { background: #fff8e1; font-weight: 700; }
        .total { text-align: right; font-size: 1.25rem; font-weight: 800; margin-top: 12px; }
        .mentions { font-size: .78rem; color: #666; margin-top: 10px; line-height: 1.5; }
        #zoneSignature { border: 2px dashed #bbb; border-radius: 8px; background: #fff; touch-action: none;
                         width: 100%; height: 180px; display: block; }
        .champ label { display: block; font-weight: 600; font-size: .85rem; margin: 12px 0 4px; }
        .champ input[type=text], .champ textarea { width: 100%; box-sizing: border-box; padding: 10px 12px;
            border: 1px solid #ccc; border-radius: 8px; font-family: inherit; font-size: 1rem; }
        .case { display: flex; gap: 10px; margin-top: 12px; font-size: .9rem; }
        .boutons { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
        .btn { flex: 1; padding: 14px; border: 0; border-radius: 10px; font-family: 'Montserrat', sans-serif;
               font-weight: 700; font-size: 1rem; cursor: pointer; min-width: 180px; }
        .btn-accepter { background: #2e7d32; color: #fff; }
        .btn-refuser { background: #eee; color: #333; }
        .btn-effacer { background: none; border: 0; color: #1565c0; cursor: pointer; padding: 6px 0; font-size: .85rem; }
        .btn:disabled { opacity: .6; cursor: wait; }
        .statut { display: none; margin-top: 16px; padding: 12px 14px; border-radius: 8px; }
        .statut.ok { display: block; background: #e8f5e9; color: #1b5e20; }
        .statut.erreur { display: block; background: #ffebee; color: #b71c1c; }
        @media (max-width: 600px) { .carte { padding: 16px; } table { font-size: .8rem; } }
    </style>
</head>
<body class="light-mode">
    <div class="barre">MECANIQUE <strong>17</strong> &mdash; votre devis</div>
    <div class="conteneur">
        <div class="carte">
            <div id="chargement">Chargement de votre devis&hellip;</div>
            <div id="introuvable" style="display:none">
                <h1>Devis introuvable</h1>
                <p>Ce lien n&rsquo;est plus valable (devis expir&eacute;, d&eacute;j&agrave; trait&eacute; ou lien incomplet).
                   Contactez le garage au <a href="tel:+33651550001">06 51 55 00 01</a>.</p>
            </div>
            <div id="devis" style="display:none">
                <h1 id="titre"></h1>
                <div class="meta" id="garage"></div>
                <div class="meta" id="pour"></div>
                <h2>D&eacute;tail</h2>
                <table>
                    <thead><tr><th>D&eacute;signation</th><th class="n">Qt&eacute;</th><th class="n">PU HT</th><th class="n">Remise</th><th class="n">Total HT</th></tr></thead>
                    <tbody id="lignes"></tbody>
                </table>
                <div class="total" id="total"></div>
                <div class="mentions" id="mentions"></div>

                <div id="zoneReponse">
                    <h2>Votre r&eacute;ponse</h2>
                    <div class="champ">
                        <label for="nom">Nom et pr&eacute;nom *</label>
                        <input type="text" id="nom" maxlength="120" autocomplete="name">
                    </div>
                    <div class="champ">
                        <label>Signature (avec le doigt ou la souris) *</label>
                        <canvas id="zoneSignature"></canvas>
                        <button type="button" class="btn-effacer" id="btnEffacer">Effacer la signature</button>
                    </div>
                    <div class="champ">
                        <label for="commentaire">Commentaire (facultatif)</label>
                        <textarea id="commentaire" rows="2" maxlength="1000"></textarea>
                    </div>
                    <label class="case"><input type="checkbox" id="accord">
                        <span>J&rsquo;ai lu ce devis et je l&rsquo;accepte : <strong>bon pour accord</strong> pour la r&eacute;alisation des travaux d&eacute;crits, aux prix indiqu&eacute;s.</span></label>
                    <div class="boutons">
                        <button type="button" class="btn btn-accepter" id="btnAccepter">Accepter et signer</button>
                        <button type="button" class="btn btn-refuser" id="btnRefuser">Refuser le devis</button>
                    </div>
                </div>
                <div id="statut" class="statut" role="status" aria-live="polite"></div>
            </div>
        </div>
    </div>
    <script src="js/devis-en-ligne.js"></script>
</body>
</html>
